<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#121211">
<title>Закрытая витрина - Мастерская</title>
<link rel="stylesheet" href="../stil.css">
<style>
/* Мастерская закрытой витрины: правка данных мастера, новые фото и видео в ленту с водяным знаком.
   Сайт статический: всё делается в браузере мастера. Если Александр включил публикацию (publik.js, код мастера),
   правки уходят на сайт кнопкой "Опубликовать"; иначе - пакетом (ZIP), который кладут в репозиторий.
   Логика - masterskaya.js. Вход - тот же пин-код (zamok.js). */
:root{--bg:var(--kr-bg);--bg2:var(--kr-bg2);--card:var(--kr-card);--line:var(--kr-line);--ink:var(--kr-ink);--muted:var(--kr-muted);--ok:var(--kr-ok);--err:var(--kr-err);--serif:var(--kr-serif);--sans:var(--kr-sans);--ease:var(--kr-ease);--pad:clamp(16px,4vw,48px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
.lead,.f small,.note{font-weight:300}
body{font-family:var(--sans);font-weight:300;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:calc(40px + var(--sb))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
.top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) var(--pad) 0}
.brand{display:flex;align-items:center;gap:12px;min-height:44px}
.brand i{width:30px;height:30px;flex:none;display:block}
.brand i svg{width:100%;height:100%;display:block}
.brand b{font-family:var(--serif);font-weight:400;font-size:20px;line-height:1.1}
.brand .bk{margin-left:auto;text-decoration:none;display:inline-flex;align-items:center;min-height:44px;font-weight:500;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;margin-top:6px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;position:relative;min-height:44px;font-weight:500;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.tabs button::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--ink);transform:scaleX(0);transform-origin:0 50%;transition:transform .5s var(--ease)}
.tabs button[aria-selected=true]{color:var(--ink)}
.tabs button[aria-selected=true]::after{transform:scaleX(1)}
@media (max-width:440px){.tabs{gap:15px}.tabs button{letter-spacing:.15em}}
.tabs button i{font-style:normal;font-weight:400;margin-left:4px;vertical-align:4px;font-size:10px}
main{max-width:1100px;margin:0 auto;padding:clamp(22px,4vh,40px) var(--pad)}
section[role=tabpanel]{animation:rise .6s var(--ease) both}
section[role=tabpanel].still{animation:none}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(30px,4.6vw,48px);line-height:1.05;margin-bottom:10px}
h2{font-family:var(--serif);font-weight:400;font-size:clamp(22px,2.6vw,30px);line-height:1.15;margin:34px 0 12px}
.lead{color:var(--muted);max-width:640px;margin-bottom:22px}
.eyebrow{display:flex;align-items:center;gap:12px;font-weight:500;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin:30px 0 14px}
.eyebrow::before{content:"";width:28px;height:1px;background:currentColor}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 22px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f.w{grid-column:1/-1}
.f label{font-weight:500;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.f textarea{min-height:110px;resize:vertical;line-height:1.5}
.f small{font-size:12.5px;color:var(--muted)}
.f .was{font-size:12px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);padding:clamp(16px,2.6vw,26px);margin-bottom:16px}
/* кнопки - из stil.css (.krs .btn); здесь только: без .l - главная (светлая рамка), .sm - поменьше */
.btn:not(.l){border-color:var(--ink)}
@media (hover:hover){.btn:not(.l):not(:disabled):hover{background:var(--ink);color:var(--bg)}}
.btn.sm{min-height:38px;padding:0 14px;font-size:10.5px}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.logo-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo-box{width:92px;height:92px;border:1px solid var(--line);display:grid;place-items:center;background:var(--bg2);flex:none}
.logo-box svg,.logo-box img{width:76px;height:76px;display:block;object-fit:contain}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:14px}
.m{position:relative;aspect-ratio:1;background:var(--bg2);border:1px solid var(--line);overflow:hidden}
.m img,.m video{width:100%;height:100%;object-fit:cover;display:block}
.m .tip{position:absolute;left:6px;top:6px;padding:2px 7px;background:rgba(20,20,19,.75);color:#fff;font-weight:500;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase}
.m .x{position:absolute;right:4px;top:4px;width:34px;height:34px;display:grid;place-items:center;background:rgba(20,20,19,.75);color:#fff}
.m .x svg{width:16px;height:16px}
.m .bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(0,0,0,.15)}
.m .bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .3s}
.m .st{position:absolute;left:0;right:0;bottom:3px;padding:6px 8px;font-size:11.5px;line-height:1.3;color:#fff;background:linear-gradient(180deg,transparent,rgba(0,0,0,.7))}
.m.err{border-color:var(--err)}
.m.err .st{background:rgba(120,40,30,.85)}
.list{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row b{font-weight:500}
.row span{color:var(--muted);font-size:13.5px}
.row .sp{flex:1;min-width:0}
/* цены быстрого расчёта */
.cn{display:grid;grid-template-columns:minmax(0,1fr) 176px;gap:6px 16px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.cn:first-of-type{border-top:0}
.cn b{font-weight:400;display:block}
.cn small{display:block;font-size:12.5px;color:var(--muted);line-height:1.35}
.cn .in{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.cn input[type=text],.cn input[type=number]{width:100px;text-align:right;font-variant-numeric:tabular-nums}
.cn .in span{font-size:12.5px;color:var(--muted);min-width:22px}
.cn.off b,.cn.off small{opacity:.45}
.cn label.chk{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-top:6px;cursor:pointer}
.cn label.chk input{width:18px;height:18px;accent-color:var(--ink)}
.cn-ex li{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-top:1px solid var(--line);list-style:none;font-size:14px}
.cn-ex li:first-child{border-top:0}
.cn-ex li span:last-child{white-space:nowrap;font-family:var(--serif);font-size:17px}
@media (max-width:520px){.cn{grid-template-columns:minmax(0,1fr) 140px}.cn input[type=text],.cn input[type=number]{width:84px}}
/* водяной знак */
.wm-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(18px,3vw,36px);align-items:start}
.pv{position:relative;background:#222;aspect-ratio:4/3;overflow:hidden}
/* предпросмотр знака держится на экране, пока двигаете ползунки (--hh - высота шапки, ставит masterskaya.js) */
.wm-grid>.wm-pv{position:sticky;top:calc(var(--hh,110px) + 12px);z-index:3}
@media (max-width:760px){.wm-grid>.wm-pv{top:var(--hh,110px);margin:0 calc(var(--pad) * -1);padding:10px var(--pad);background:var(--bg);border-bottom:1px solid var(--line)}
  .wm-pv .pv{aspect-ratio:auto;height:min(30vh,240px)}.wm-pv .note{display:none}}
.pv canvas{width:100%;height:100%;display:block;object-fit:contain}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:40px;padding:0 14px;border:1px solid var(--line);background:transparent;font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.seg button{color:var(--muted)}.seg button[aria-pressed=true]{color:var(--ink);border-color:var(--ink)}
.pos{display:grid;grid-template-columns:repeat(3,44px);gap:6px}
.pos button{width:44px;height:44px;border:1px solid var(--line);background:transparent;position:relative}
.pos button::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;background:var(--line)}
.pos button[aria-pressed=true]{border-color:var(--ink)}
.pos button[aria-pressed=true]::after{background:var(--ink)}
.rng{display:flex;align-items:center;gap:12px}
.rng input{flex:1;accent-color:var(--ink)}
.rng output{min-width:46px;text-align:right;font-variant-numeric:tabular-nums;font-size:14px}
.note{font-size:13.5px;color:var(--muted);border-left:1px solid var(--ink);padding:4px 0 4px 14px;margin:16px 0}
.note b{color:var(--ink)}
.fon-g{display:grid;grid-template-columns:minmax(0,.62fr) minmax(0,1fr);gap:16px;align-items:start}
.fon-s{display:flex;flex-direction:column;gap:8px;min-width:0}
.fon-s .bx{position:relative;background:var(--bg2);border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;padding:10px;color:var(--muted);font-size:12.5px;line-height:1.35;text-align:center}
.fon-s .bx.t{aspect-ratio:9/16}.fon-s .bx.w{aspect-ratio:16/9}
.fon-s .bx video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fon-s .bx.err{border-color:var(--err);color:var(--err)}
.fon-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.fon-pick button{position:relative;aspect-ratio:4/3;padding:0;border:1px solid var(--line);overflow:hidden;background:var(--bg2)}
.fon-pick button img{width:100%;height:100%;object-fit:cover;display:block}
.fon-pick button[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:2px}
.fon-cur{width:min(220px,60%);aspect-ratio:9/16;margin-top:14px;background:#222 center/cover no-repeat;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + var(--sb));z-index:50;transform:translate(-50%,20px);opacity:0;padding:12px 18px;background:var(--card);color:var(--ink);border:1px solid var(--kr-line2);font-weight:500;font-size:13px;letter-spacing:.03em;transition:opacity .3s,transform .3s var(--ease);pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.save{font-size:12px;color:var(--muted)}
.busy{position:fixed;inset:0;z-index:40;background:rgba(18,18,17,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
.busy b{font-family:var(--serif);font-weight:400;font-size:26px}
.busy .pb{width:min(360px,80vw);height:2px;background:var(--line)}
.busy .pb i{display:block;height:100%;width:0;background:var(--ink)}
.busy span{color:var(--muted);font-size:14px;max-width:420px}
@media (max-width:760px){.g2,.wm-grid{grid-template-columns:1fr}.brand b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:18px}.brand .bk{letter-spacing:.12em;flex:none}}
.brand nav.kn{margin-left:auto;color:var(--ink);flex-wrap:nowrap;flex:none}
/* голос и вставка у полей */
.vt{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.vt button{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 12px;border:1px solid var(--line);background:transparent;font-weight:500;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.vt button svg{width:15px;height:15px;flex:none}
.vt button.on{border-color:var(--err);color:var(--err)}
.vt button.on svg{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.vt .live{flex-basis:100%;font-size:13px;color:var(--muted);min-height:0}
.vt .live:empty{display:none}
/* публикация */
.pub-ok{border-color:var(--ok)}
.pub-ok h2{margin-top:0;color:var(--ok)}
.code{font-family:var(--serif);font-size:clamp(28px,6vw,40px);letter-spacing:.08em;margin:8px 0 4px;user-select:all;-webkit-user-select:all;word-break:break-all}
.chk{display:flex;align-items:flex-start;gap:10px;margin-top:12px;font-size:14.5px;cursor:pointer}
.chk input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--ink)}
.banner{max-width:1100px;margin:0 auto;padding:10px var(--pad);font-size:13.5px;color:var(--muted);border-bottom:1px solid var(--line)}
.banner[hidden]{display:none}
.small-link{background:none;border:0;padding:0;font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:36px}
.hidden-w{opacity:.55}
/* фото работы: на витрине и новые; точки, удаление (2026-11-24) */
.mh{font-weight:500;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:22px 0 0}
.mhs{font-size:13px;color:var(--muted);margin:4px 0 0;max-width:620px}
.m .pt{position:absolute;left:6px;bottom:6px;min-height:32px;padding:0 10px;background:rgba(20,20,19,.82);color:#fff;font-weight:500;font-size:10px;letter-spacing:.12em;text-transform:uppercase;border:1px solid rgba(255,255,255,.25)}
.m.del img{opacity:.3;filter:grayscale(1)}
.m.del .st{bottom:44px;background:none}
.m .st~.pt{bottom:6px}
/* окно точек на фото */
html.pe-on,html.pe-on body{overflow:hidden}
.pe{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
.pe-top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) var(--pad) 10px;border-bottom:1px solid var(--line)}
.pe-top b{font-family:var(--serif);font-weight:400;font-size:20px}
.pe-top .sp{flex:1}
.pe-sc{flex:1;overflow:auto;padding:14px var(--pad) calc(30px + var(--sb));-webkit-overflow-scrolling:touch}
.pe-h{font-size:13.5px;color:var(--muted);max-width:640px;margin-bottom:12px}
.pe-ph{display:flex;justify-content:center;background:#0c0c0b;border:1px solid var(--line);padding:8px}
.pe-in{position:relative;display:inline-block;touch-action:none;cursor:crosshair;user-select:none;-webkit-user-select:none}
.pe-in img{display:block;max-width:100%;max-height:min(58vh,620px);width:auto;height:auto}
.pe-p{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#F1EEE8;color:#121211;font-weight:500;font-size:13px;display:grid;place-items:center;box-shadow:0 0 0 6px rgba(241,238,232,.28),0 2px 10px rgba(0,0,0,.5);cursor:grab;touch-action:none}
.pe-list{display:grid;gap:10px;margin-top:14px;max-width:760px}
.pe-r{display:grid;grid-template-columns:30px 1fr 40px;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.pe-r i{font-style:normal;width:28px;height:28px;border-radius:50%;border:1px solid var(--kr-line2);display:grid;place-items:center;font-size:13px;margin-top:8px}
.pe-f{display:grid;gap:8px;min-width:0}
.pe-f textarea{min-height:0;resize:vertical}
.pe-d{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted)}
.pe-d svg{width:16px;height:16px}
.pe-e{color:var(--muted);font-size:14px;padding:6px 0}
@media (min-width:900px){.pe-sc{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);gap:0 28px;align-content:start}
  .pe-h{grid-column:1/-1}.pe-ph{position:sticky;top:0;align-self:start}.pe-in img{max-height:calc(100vh - 190px)}.pe-list{margin-top:0}}
/* комнаты */
.kdel{padding:4px 0 14px;border-top:0}
.ktit{flex:none;width:52px;height:52px;padding:0;border:1px solid var(--line);background:var(--bg2);overflow:hidden;cursor:pointer}
.ktit img{width:100%;height:100%;object-fit:cover;display:block}
.ktit[aria-expanded=true]{outline:2px solid var(--ink);outline-offset:2px}
.otzs{padding:0}
.otzh{display:block;width:100%;padding:clamp(14px,2.4vw,22px);border:0;background:none;text-align:left;font:inherit;color:inherit;cursor:pointer}
.otzh b{display:block;font-weight:600;margin-bottom:4px}
.otzh span{display:block;color:var(--muted);line-height:1.45;overflow-wrap:anywhere}
.otzh small{display:block;margin-top:8px;font-size:12px;letter-spacing:.04em;color:var(--muted)}
.otzh:hover b{text-decoration:underline;text-underline-offset:3px}
.kmv{display:flex;gap:4px}
.kl .row{flex-wrap:wrap}
.kl .row>.sp{flex:1 1 150px;min-width:0}
@media (max-width:520px){.kl .row>.kmv{margin-left:64px}}
.kmv .btn{min-width:36px;padding-left:0;padding-right:0}
.kmv .btn:disabled{opacity:.3;cursor:default}
.kdel p{font-size:14px;margin:0 0 8px}
/* шрифты: пары на выбор */
.shr{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-bottom:8px}
.shr button{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;padding:18px 18px 16px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:150px}
.shr button[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.shr .sh-h{font-size:24px;line-height:1.12;font-weight:400}
.shr .sh-t{font-size:14px;line-height:1.45;font-weight:300;color:var(--muted)}
.shr .sh-n{margin-top:auto;font-size:12px;color:var(--muted);line-height:1.4}
.shr .sh-n b{display:block;color:var(--ink);font-weight:500;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:2px}
.shr button[aria-pressed=true] .sh-n b::after{content:" - выбрано";letter-spacing:.1em}
@media (hover:hover){.shr button:hover{border-color:var(--kr-line2)}}
.how{margin:0 0 8px;padding:0;list-style:none;counter-reset:h;max-width:640px}
.how li{counter-increment:h;position:relative;padding:10px 0 10px 42px;border-top:1px solid var(--line);color:var(--muted);font-size:15px}
.how li::before{content:counter(h);position:absolute;left:0;top:9px;width:28px;height:28px;border:1px solid var(--kr-line2);border-radius:50%;display:grid;place-items:center;font-size:13px;color:var(--ink)}
.more{margin-top:30px;border-top:1px solid var(--line)}
.more summary{cursor:pointer;list-style:none;min-height:48px;display:flex;align-items:center;gap:10px;font-weight:500;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.more summary::-webkit-details-marker{display:none}
.more summary::after{content:"";width:7px;height:7px;border-right:1px solid currentColor;border-bottom:1px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .3s}
.more[open] summary::after{transform:rotate(-135deg)}
.more .mi{padding:14px 0;border-top:1px solid var(--line)}
.more .mi b{font-weight:500}.more .mi p{color:var(--muted);font-size:14px;margin:4px 0 0;max-width:560px}.more .mi .btns{margin-top:10px}
/* помощь: как пользоваться (pomosh.js) */
.hp-toc{list-style:none;counter-reset:t;margin:6px 0 34px;padding:0;border-top:1px solid var(--line)}
.hp-toc li{counter-increment:t;border-bottom:1px solid var(--line)}
.hp-toc a{display:flex;gap:16px;align-items:baseline;padding:13px 0;text-decoration:none;color:var(--ink);font-size:15.5px}
.hp-toc a::before{content:counter(t);font-family:var(--kr-serif);font-size:15px;color:var(--muted);min-width:14px}
@media (hover:hover){.hp-toc a:hover{color:var(--muted)}}
